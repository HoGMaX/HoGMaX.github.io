<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
  <meta content="#11110f" name="theme-color"/>
  <title>
   Prompt &mdash; Artistic
  </title>
  <link href="css/prompt.min.css" rel="stylesheet"/>
 </head>
 <body class="prompt-page">
  <!-- Header & language switcher -->
<header class="site-header">
   <div class="layout-container site-header__inner">
    <a class="site-header__logo" href="./">
     ARTISTIC
    </a>
    <button class="language-switcher" id="promptLanguageToggle" type="button">
     <span class="language-switcher__option" data-lang="en">
      EN
     </span>
     <span class="language-switcher__divider">
      /
     </span>
     <span class="language-switcher__option" data-lang="uk">
      UA
     </span>
    </button>
   </div>
  </header>
  <!-- Prompt detail -->
<main>
   <div class="layout-container prompt-page" id="promptContent">
    <div class="prompt-page__loading">
     Loading prompt...
    </div>
   </div>
  </main>
  <!-- Footer -->
<footer class="site-footer">
   <div class="layout-container site-footer__inner">
    <span>
     ARTISTIC
    </span>
    <span>
     Prompt Library
    </span>
   </div>
  </footer>
  <script src="js/prompt.js">
  </script>
 </body>
</html>
